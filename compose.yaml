services:
  mongodb0:
    image: mongo:8
    container_name: mongodb0
    hostname: mongodb0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-recipes}
    command: --replSet "rs0" --bind_ip "127.0.0.1,mongodb0" --keyFile "/etc/mongodb/keyfile"
    ports:
      - 27017:27017
    healthcheck:
      test: echo "try {rs.status()} catch(err) {rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb0:27017',priority:1},{_id:1,host:'mongodb1:27017',priority:0.5}]})}" | mongosh --port 27017 -u '${MONGO_ROOT_USER}' -p '${MONGO_ROOT_PASSWORD}' --authenticationDatabase admin --quiet
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - mongodb0_data:/data/db
      - $PWD/scripts/mongo-keyfile:/etc/mongodb/keyfile

  mongodb1:
    image: mongo:8
    container_name: mongodb1
    hostname: mongodb1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: --replSet "rs0" --bind_ip "127.0.0.1,mongodb1" --keyFile "/etc/mongodb/keyfile"
    ports:
      - 27018:27017
    volumes:
      - mongodb1_data:/data/db
      - $PWD/scripts/mongo-keyfile:/etc/mongodb/keyfile

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    depends_on:
      mongodb0:
        condition: service_healthy
    environment:
      ME_CONFIG_BASICAUTH: false
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb0:27017,mongodb1:27017/?replicaSet=rs0&authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb0_data:
  mongodb1_data:
  rabbitmq_data:
